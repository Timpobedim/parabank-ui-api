[project]
name = "parabank-ui-api"
version = "1.0.0"
description = "UI- и API-автотесты демо-банка ParaBank: Playwright + pytest + requests + Allure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.55",
    "pytest>=8.4",
    "pytest-playwright>=0.7",
    "requests>=2.32",
    "allure-pytest>=2.15",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "faker>=37",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "mypy>=1.17",
    "types-requests>=2.32",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--browser=chromium",
    "--screenshot=only-on-failure",
    "--tracing=retain-on-failure",
    "--output=test-results",
    "--alluredir=allure-results",
    "--clean-alluredir",
]
markers = [
    "sanity: быстрый набор ключевых сценариев",
    "api: тесты REST API",
    "ui: тесты интерфейса",
    "e2e: сценарии, где API и UI работают вместе",
    "known_defect(bug_id, summary): тест фиксирует известный дефект, см. docs/bug-reports",
]
xfail_strict = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "PT", "RUF"]
# RUF001-003: в русских строках есть кириллица, похожая на латиницу, — это нормально.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# В тестах — assert и пароли тестовых клиентов демо-банка.
"tests/**" = ["S101", "S105", "S106"]
"src/parabank/data/factories.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["parabank"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
